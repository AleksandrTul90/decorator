[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = ["src"]
exclude = '^(tests/)'

